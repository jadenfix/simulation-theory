name: paper-identifiability

on:
  pull_request:
    paths:
      - 'paper/identifiability-before-anthropic-bayes/**'
      - 'tests/test_paper_identifiability_before_anthropic_bayes.py'
      - '.github/workflows/paper-identifiability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Run exact paper tests
        run: python -m pytest -q tests/test_paper_identifiability_before_anthropic_bayes.py

      - name: Reproduce exact receipt and require clean diff
        working-directory: paper/identifiability-before-anthropic-bayes
        run: |
          python reproduce.py
          git diff --exit-code -- receipt.json

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended poppler-utils

      - name: Record toolchain and source provenance
        working-directory: paper/identifiability-before-anthropic-bayes
        run: |
          {
            printf 'git_commit '
            git rev-parse HEAD
            python --version
            pdflatex --version | head -n 1
            bibtex --version | head -n 1
            pdfinfo -v 2>&1 | head -n 1
            uname -a
          } | tee toolchain.txt

      - name: Build manuscript
        working-directory: paper/identifiability-before-anthropic-bayes
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          bibtex paper
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex

      - name: Fail on unresolved references or overfull boxes
        working-directory: paper/identifiability-before-anthropic-bayes
        run: |
          ! grep -E 'LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|There were undefined citations' paper.log
          ! grep -E 'Overfull \\hbox|Overfull \\vbox' paper.log

      - name: PDF preflight and release hashes
        working-directory: paper/identifiability-before-anthropic-bayes
        run: |
          test -s paper.pdf
          pdfinfo paper.pdf | tee pdfinfo.txt
          grep -q 'Title:.*Identifiability Before Anthropic Bayes' pdfinfo.txt
          grep -q 'Author:.*Jaden Fix' pdfinfo.txt
          sha256sum \
            paper.tex references.bib claims.json citation_provenance.json \
            reproduce.py receipt.json README.md PEER_REVIEW_LOOP.md \
            PEER_REVIEW_RESPONSE.md ROUND6_MEASURE_THEORETIC_AUDIT.md \
            FIELD_IMPACT_AUDIT.md ROUND8_XEROGRAPHIC_PRIOR_ART_AUDIT.md \
            ROUND9_CONTEMPORANEOUS_PRIOR_ART_AND_SCOPE_AUDIT.md \
            ROUND10_OBSERVER_SELECTION_PRIOR_ART_AUDIT.md \
            AUDIT.md toolchain.txt paper.bbl paper.log pdfinfo.txt paper.pdf \
            ../../tests/test_paper_identifiability_before_anthropic_bayes.py \
            ../../.github/workflows/paper-identifiability.yml \
            > release_hashes.txt

      - name: Upload release-candidate source and audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: identifiability-before-anthropic-bayes
          path: |
            paper/identifiability-before-anthropic-bayes/paper.pdf
            paper/identifiability-before-anthropic-bayes/paper.tex
            paper/identifiability-before-anthropic-bayes/paper.bbl
            paper/identifiability-before-anthropic-bayes/paper.log
            paper/identifiability-before-anthropic-bayes/references.bib
            paper/identifiability-before-anthropic-bayes/claims.json
            paper/identifiability-before-anthropic-bayes/citation_provenance.json
            paper/identifiability-before-anthropic-bayes/reproduce.py
            paper/identifiability-before-anthropic-bayes/README.md
            paper/identifiability-before-anthropic-bayes/receipt.json
            paper/identifiability-before-anthropic-bayes/release_hashes.txt
            paper/identifiability-before-anthropic-bayes/pdfinfo.txt
            paper/identifiability-before-anthropic-bayes/toolchain.txt
            paper/identifiability-before-anthropic-bayes/AUDIT.md
            paper/identifiability-before-anthropic-bayes/PEER_REVIEW_LOOP.md
            paper/identifiability-before-anthropic-bayes/PEER_REVIEW_RESPONSE.md
            paper/identifiability-before-anthropic-bayes/ROUND6_MEASURE_THEORETIC_AUDIT.md
            paper/identifiability-before-anthropic-bayes/FIELD_IMPACT_AUDIT.md
            paper/identifiability-before-anthropic-bayes/ROUND8_XEROGRAPHIC_PRIOR_ART_AUDIT.md
            paper/identifiability-before-anthropic-bayes/ROUND9_CONTEMPORANEOUS_PRIOR_ART_AND_SCOPE_AUDIT.md
            paper/identifiability-before-anthropic-bayes/ROUND10_OBSERVER_SELECTION_PRIOR_ART_AUDIT.md
            tests/test_paper_identifiability_before_anthropic_bayes.py
            .github/workflows/paper-identifiability.yml
