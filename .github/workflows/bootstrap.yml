name: install validated research bundle

on:
  push:
    branches: [research]
    paths:
      - .bootstrap/READY

permissions:
  contents: write

concurrency:
  group: simulation-theory-bootstrap
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and install exact research tree
        shell: bash
        run: |
          set -euo pipefail

          find .bootstrap/chunks -type f -name '*.part' -print0 \
            | sort -z \
            | xargs -0 cat > /tmp/simulation-theory.bundle.b64

          echo '495f9b59490a2d4c44a8413f54f520fc3d79cd66682fed05cff98312bb6d2fef  /tmp/simulation-theory.bundle.b64' \
            | sha256sum -c -

          base64 --decode /tmp/simulation-theory.bundle.b64 \
            > /tmp/simulation-theory.bundle.tar.gz

          echo '7ff135b6bc25fa59ed15512cc98c0e9b94fcc7bb43805a6cba7d7d2f8036a5f4  /tmp/simulation-theory.bundle.tar.gz' \
            | sha256sum -c -

          if tar -tzf /tmp/simulation-theory.bundle.tar.gz \
            | grep -Eq '(^|/)\.\.(/|$)|^/'; then
            echo 'unsafe archive path' >&2
            exit 1
          fi

          tar -xzf /tmp/simulation-theory.bundle.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

          python -m compileall -q src

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet \
            || git commit -m 'research: install validated research bundle'
          git push origin HEAD:research
